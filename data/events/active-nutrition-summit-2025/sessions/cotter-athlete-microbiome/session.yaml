  June, "Active Nutrition and Health Weight Management"), not the final programme; start and end times are not given. The programme
  bills Cotter as Head of Food Biosciences and Head of Microbiology, with Teagasc and SeqBiome logos. The billed title is ours, from
  the deck's file name; the title slide reads "Harnessing Knowledge Gained from Studies of Athlete Microbiomes". Most slides are figures;
  their content is read from the slide images. The sample codes on the kefir cholesterol chart (COM, ICK, Pitch, PNY, PNL) are not explained
  on the slide, nor is the study population. Whether Nathan attended is not known.
