# Companies worth following up from the shows: possible acquisitions, partners and suppliers (Nathan, 17 Nov 2026).
# The source for the cross-show roundup after FiE 2026. Each lead points at the sessions or conversations it comes from.
# kinds: acquisition, partner, supplier, customer. status: heard, researching, in discussion, parked, passed.
# confidential: true keeps a lead out of anything that leaves the repo (the Suite API never carries leads).
leads:
- id: clasado
  company: Clasado (Bimuno GOS)
  kinds: [acquisition]
  status: researching
  confidential: true
  sources:
  - {event: fie-2026, session: clasado-bimuno-gos}
  summary: Reading-based maker of Bimuno GOS (prebiotic), ingredient-only since its consumer brand was sold in 2025; loss-making and funded by its trust-owned Jersey parent; its CEO named a likely sale price; Nathan rates the growth potential highly.
  added: '2026-11-17'
- id: aidp
  company: AIDP
  kinds: [acquisition]
  status: researching
  confidential: true
  sources:
  - {event: fie-2026, session: aidp-possible-sale}
  summary: US branded-ingredient company (owner of Magtein magnesium L-threonate, run by sister company ThreoTech) expected to be for sale within two years after its founder died in 2026; probably too big for Vita Actives alone (Nathan).
  added: '2026-11-17'
- id: fairfield-nutech
  company: Fairfield Nutech (as dictated; most likely Fayrefield Nutratek Ltd, Crewe)
  kinds: [acquisition, partner]
  status: researching
  confidential: true
  sources:
  - {event: fie-2026, session: fairfield-nutech-exit-plan}
  summary: Dairy-protein and sports-ingredient house (clear whey, hydrolysates, application systems; exclusive UK and Western Europe distributor of Jenerise creatine), set up 2025 and 75% owned by the UK and Danish Fayrefield groups; Jordan, who runs it, spoke of a two to three year exit plan.
  added: '2026-11-17'
