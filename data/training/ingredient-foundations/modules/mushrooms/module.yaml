to_check: >-
  The PDF was rendered by LibreOffice: stray labels from a graphic ("Design", "Evaluate") sit over the text on most
  content slides (e.g. "ModernDesign science" on slide 4) and on slide 15 a white caption overlaps the charts; a
  PowerPoint-exported PDF would render more faithfully. Slides 6 and 12 are linked YouTube videos
  (https://www.youtube.com/watch?v=XN8dFLTH58o and QLmNiqjQ1Qo) that show as grey boxes in the PDF; their content is
  not in this reading. The deck states no version or date; the audience is taken from objective 05 (slide 2).
  Objective 02 (slide 2) promises extraction methods, but no slide covers them (slide 11 shows food processing only).
  Slides 10 and 11 are diagrams with no source named. Slide 8's notes are repeated on slide 9.
  Figures (slide 15): "All data from Spins", but no period, market or date is given.
  Our position to confirm (slide 17): all our mushrooms are sourced on non-peanut substrates.
  Claim to check (slide 3, 5, 8): lion's mane hericenones and erinacines "may stimulate" NGF on slide 3, but "stimulate
  nerve growth factor (NGF), essential for cognitive health and nerve regeneration" unhedged on slide 8.
  Claim to check (slide 9): cordycepin "has been shown to enhance ATP production and oxygen uptake"; betulinic acid
  (chaga) "anticancer properties"; ergosterol "supports bone health"; ganoderic acids "adaptogenic, immune support".
  Claim to check (slides 3, 5, 8): reishi "immune support and stress relief"; cordyceps "energy and endurance"; chaga
  "antioxidant support, anti-aging"; turkey tail PSK and PSP "gut and immune health"; beta-glucans "immune
  modulation"; triterpenoids "anti-inflammatory, adaptogenic".
  Claim to check (slides 10, 11): diagram labels such as anti-diabetic, anti-carcinogenic, anti-viral, controls obesity,
  osteoporosis, hepatoprotective, neuro-protective.
  Claim to check (slide 4): "Modern science continues to validate their therapeutic properties".
  Claim to check (slide 16): standardised extracts as "a cornerstone of reliable health claims"; as far as we know none
  of these mushroom benefits is an authorised EU health claim.
  Narration (narration.md): 5 of 19 slide scripts are drafts for Nathan to review (slides 6, 11, 12, 14, 15), plus the 2
  video introductions. Slide 9's speaker notes repeat slide 8's word for word, so its narration does not cover slide 9's
  own bioactives (ganoderic acids, betulinic acid, ergosterol); a slide 9 script may be wanted. Speaker notes tidied:
  stray closing quotation marks removed (slides 3, 18), missing full stops added (slides 1, 8, 9). The slide 14 draft
  names the brands shown on the packs. Video titles and channels from YouTube oEmbed (25 Nov 2026); the videos are
  third-party and not reviewed by us. Claim to check (speaker notes, slides 3 and 5): reishi "calming and immune-
  boosting properties"; cordyceps "ability to enhance energy and endurance" and "enhances energy and endurance by
  improving oxygen uptake and ATP production"; lion's mane compounds "shown to promote nerve growth factor"; chaga
  "packed with antioxidants that fight oxidative stress"; turkey tail PSK and PSP "used in immune health and gut
  support". Claim to check (speaker notes, slide 4): "modern science, which continues to uncover and validate the health
  benefits of these incredible fungi". Claim to check (speaker notes, slides 8 and 9): beta-glucans "modulate the immune
  system by enhancing the activity of immune cells"; triterpenoids "have potent anti-inflammatory and adaptogenic
  effects. They help the body manage stress"; ergothioneine "protects cells from oxidative stress" (close to the wording
  of an authorised claim for some vitamins and minerals, which does not cover ergothioneine); hericenones and
  erinacines' "ability to stimulate nerve growth factor (NGF), which is vital for cognitive health and memory" (no
  hedge); cordycepin "enhances energy production at the cellular level". Claim to check (speaker notes, slide 13):
  cordyceps and lion's mane "for enhanced endurance, focus, and recovery". Claim to check (speaker notes, slide 16):
  standardised extracts "more reliable for product formulation and health claims"; reishi standardised for triterpenoids
  "for stress and immune support".
