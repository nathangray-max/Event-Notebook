to_check: >-
  The PDF was rendered by LibreOffice and many slides have overlapping text (the "Amino Acids" title over "Objectives" on
  slide 2, decorative shapes over the text on slides 4, 7, 10 and 13, titles over body text on slides 18 to 28) and
  cut-off text (the last lines of slides 19, 22, 25, 28 and 29 are missing from the PDF but are in the pptx); a
  PowerPoint-exported PDF would render more faithfully. Slides 6, 8, 14 and 16 are linked YouTube videos
  (https://www.youtube.com/watch?v=aktEQ90Wpkw, 9ssCKw-7OvQ, fPrkarBzrg0, VI1ihdoX9lQ; the notes say slide 14 is a
  MyProtein video on BCAAs) that show as grey boxes in the PDF; their content is not in this reading. The speaker notes
  on slide 1 describe a session on "herbal and botanical extracts" (left over from another deck). The deck states no
  version, date or audience; the notes say about 40 minutes.
  Figures (slide 21): animal feed amino acids market about US$14.1 bn by 2027, 5% CAGR 2019-2027: an infographic with
  no source named.
  Accuracy to check: slide 24 writes "Glutamic Acid (Glutamine)" and slide 19 "Glutamine as a flavour enhancer", but
  glutamic acid (glutamate, as in MSG) and glutamine are different amino acids; slide 13 spells aspartate "Asparatate"
  and lists cysteine as non-essential; slide 10 describes primary structure as "short peptides ... e.g. collagen
  peptides" where primary structure usually means the amino acid sequence of any protein.
  Claim to check (slide 18): arginine "nitric oxide production for improved blood flow"; glutamine "supports gut health
  and intestinal integrity"; leucine "activates muscle protein synthesis".
  Claim to check (slide 19): collagen peptides "for skin hydration and elasticity"; tryptophan and tyrosine for mood and
  focus.
  Claim to check (slide 25): tryptophan in fortified foods "to support mood and sleep health".
  Claim to check (slide 26): BCAAs "reduce exercise-induced muscle breakdown"; beta-alanine buffers lactic acid;
  L-carnitine "enhances fat metabolism ... and endurance"; "reduces muscle soreness and recovery time".
  Claim to check (slide 27): "reduces visible signs of aging, such as wrinkles and fine lines"; cysteine and methionine
  for hair and nail strength; arginine "supporting a healthy glow".
  Claim to check (slide 28): glycine "promotes deep, restful sleep"; tyrosine "enhancing focus and stress resilience";
  glutamine "repairs intestinal lining"; arginine and cysteine for immune response.
  The animal benefits on slides 20 and 22 fall under feed and pet food rules, not EU health claims.
  Narration (narration.md): 17 of 33 slide scripts are drafts for Nathan to review (slides 1, 3, 5, 6, 8, 9, 11, 12, 14,
  16, 17, 20, 21, 23, 25, 27, 28), plus the 4 video introductions. Slide 1 is drafted because its speaker notes belong
  to another deck (herbal and botanical extracts); slide 11 is drafted because its notes are an unfinished sentence
  ("Depending on the amino acid polymer structure, this will impact the tertiary and quaternary"). Slide 9 repeats slide
  5 (the 20 common amino acids chart). Speaker notes tidied: list dashes and line breaks joined into sentences (slides
  4, 7), stray closing quotation marks removed (slides 10, 19, 29 to 32), "therefor it's function" corrected to
  "therefore its function" (slide 7), missing full stops added (slides 4, 13). Several notes are far longer than the
  40-100 word target (slide 13 about 350 words; slides 2, 4, 7 and 32 about 190 to 270). Video titles and channels from
  YouTube oEmbed (25 Nov 2026); the videos are third-party and not reviewed by us. Claim to check (speaker notes, slide
  13): BCAAs "key for muscle repair and energy"; glutamine "important for gut health and immune function"; arginine
  "plays a role in wound healing and nitric oxide production, which supports blood flow". Claim to check (speaker notes,
  slide 18): arginine "supports nitric oxide production, which improves blood flow"; glutamine "aids gut health";
  leucine "known for its ability to trigger muscle protein synthesis". Claim to check (speaker notes, slide 19): EAAs
  and BCAAs "staples for muscle repair, endurance, and recovery"; glutamine "to support intestinal integrity and
  repair"; collagen supplements "promoting skin elasticity and hydration"; tryptophan and tyrosine "influencing mood and
  focus". Claim to check (speaker notes, slide 26): leucine "the most potent BCAA for muscle protein synthesis". Claim
  to check (speaker notes, slide 31): collagen's "benefits, such as promoting skin elasticity, hydration, and joint
  health" and collagen peptides' "ability to stimulate collagen production in the skin". As far as we know none of these
  is an authorised EU health claim for the amino acid or collagen named.
